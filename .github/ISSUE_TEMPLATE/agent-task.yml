name: Executable Agent Task
description: Track an independently reviewable deliverable with a stable objective and acceptance contract.
title: "[Task] "
body:
  - type: markdown
    attributes:
      value: |
        Use this form when work is ready to execute against a concrete outcome and completion criteria. For durable problem or product work whose direction or executable decomposition is still evolving, use the Exploratory Initiative form instead. Routine repository maintenance can still start directly from a PR when the PR is a sufficient public record.

  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What concrete outcome should exist when this task is complete?
      placeholder: Implement / migrate / document / correct ...
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: Observable conditions that define completion. Use a checklist when useful.
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Only the files, links, prior decisions, or system behavior needed to execute safely.
      placeholder: |
        Relevant files / links:
        - `src/...`
        - #123
    validations:
      required: false

  - type: textarea
    id: constraints
    attributes:
      label: Constraints / Non-goals
      description: Important compatibility requirements, boundaries, or things that must not change.
      placeholder: |
        - Preserve existing API behavior.
        - Non-goal: ...
    validations:
      required: false

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies / Blockers
      description: External input or work this task depends on, if any.
      placeholder: Blocked by #123 / awaiting ...
    validations:
      required: false
